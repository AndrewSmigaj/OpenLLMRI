# Backend — continuous integration (the "auto-checks on every push").
#
# Runs on a GitHub Linux runner, CPU only, and stamps a green check / red X on each commit that
# touches the backend:
#   - every backend file compiles
#   - ruff (the rules in pyproject.toml), over the backend and its tests
#   - mypy, strict (pyproject.toml)
#   - pytest backend/tests (CPU only: no model, no MUD)
#
# The environment is the exact lock (backend/requirements.lock.txt) with one swap: the CPU build
# of torch 2.9.1 instead of the CUDA build, and without the CUDA-only packages (triton, nvidia-*).
# Runners have no GPU, and nothing here loads the model.

name: backend

on:
  push:
    paths:
      - 'backend/**'
      - 'pyproject.toml'
      - '.github/workflows/backend.yml'

jobs:
  checks:
    name: compile + lint + types + tests (CPU)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python 3.10.12 (the version the lock was made with)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt

      - name: Install the locked environment, CPU-only
        run: |
          grep -vE '^(torch|triton|nvidia-[a-z0-9-]+)==' backend/requirements.lock.txt > "$RUNNER_TEMP/requirements.cpu.txt"
          pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r "$RUNNER_TEMP/requirements.cpu.txt"

      - name: Every backend file compiles
        run: python -m compileall -q backend/src

      - name: Lint (ruff)
        run: ruff check backend/src backend/tests

      - name: Type check (mypy, strict)
        run: mypy

      - name: Backend tests
        run: python -m pytest backend/tests -q

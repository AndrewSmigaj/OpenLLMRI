# Frontend — continuous integration (the "auto-checks on every push").
#
# Runs the same checks as local development on a GitHub Linux runner, and stamps a green
# check / red X on each commit that touches the frontend:
#   - npm run lint    ESLint
#   - npm run build   the TypeScript type check (tsc -b), then the production build (vite build)
#
# The dev server never type-checks, so this is what catches a type error before it ships.

name: frontend

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

jobs:
  checks:
    name: lint + type check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node 20 (Vite 7 needs 20.19 or later)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check and production build
        run: npm run build

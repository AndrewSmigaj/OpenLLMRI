# Draft A for the second polishing pass (2026-10-24): one floor, a gallery. Claude's draft, for
# Andrew to pick from with drafts B, C and D. Rooms marked `stage: suggested` are Claude's
# suggestions, for Andrew to keep or veto; `stage: later` marks rooms the design already plans for
# later. The rules are those of data/institute/layout.yaml.

version: 1
title: "A · One floor: the gallery"
about: >-
  One long gallery runs from the entrance hall to the back, and the further in, the deeper the
  work: the public rooms and the simulation rooms around the entrance, then the instruments, then
  the records and the paradigm, then the four departments at the back, each with its own rooms.
  The stairs up from the entrance hall are out of service.

floors:
  - id: ground
    name: The institute
    note: one floor

departments:
  - id: linguistics
    name: Linguistics
  - id: mech_interp
    name: General mechanistic interpretability
  - id: alignment
    name: Alignment
  - id: discordant
    name: Discordant studies

rooms:
  # ---- At the entrance: the public rooms and the simulation rooms ----
  - id: entrance_hall
    name: Entrance hall
    floor: ground
    at: [4, 8]
    opens: entrance
    summary: Where everyone arrives, with the greeter, the map of the institute and the quick-jump box. Today's hub.
    exits: {west: lounge, east: simulator, northwest: public_sim_1, northeast: public_sim_2,
            north: gallery_instruments}
    closed:
      up: The stairs up are out of service; the floor above is closed.
    characters:
      - id: greeter
        name: The greeter
        note: An AI with a form, who meets visitors and points them to the rooms. Its mind comes with the AI scientists (slice 11).
  - id: lounge
    name: Lounge
    floor: ground
    at: [3, 8]
    summary: A place to spend time and talk, with people and with the AIs. It has no tools.
    exits: {east: entrance_hall, west: library}
  - id: library
    name: Library
    floor: ground
    at: [2, 8]
    opens: library
    summary: The sentence sets with their guides and audits, the scenario sets, the captures and the saved lenses; later the builder for sets and scenarios.
    exits: {east: lounge}
  - id: simulator
    name: Simulator
    floor: ground
    at: [5, 8]
    opens: simulation
    summary: Today's simulator, kept. Every scenario set in the library is loaded and played from here.
    exits: {west: entrance_hall, east: watch_room}
  - id: watch_room
    name: Watch room
    floor: ground
    at: [6, 8]
    stage: suggested
    summary: >-
      Follow agent runs as they play, each run's lens readings step by step beside its game text and
      reasoning, with an alert when a run enters a state being watched (Watch, slice 4). It sits
      beside the simulation rooms, so a run can be watched next to where it plays.
    exits: {west: simulator, northwest: public_sim_2, north: public_sim_3}
  - id: public_sim_1
    name: Public simulation room 1
    floor: ground
    at: [3, 7]
    opens: simulation
    summary: Visitors play Winter Survival; researchers watch, or start agent runs.
    exits: {southeast: entrance_hall}
  - id: public_sim_2
    name: Public simulation room 2
    floor: ground
    at: [5, 7]
    opens: simulation
    summary: Visitors play Winter Survival; researchers watch, or start agent runs.
    exits: {southwest: entrance_hall, southeast: watch_room}
  - id: public_sim_3
    name: Public simulation room 3
    floor: ground
    at: [6, 7]
    opens: simulation
    summary: Visitors play Winter Survival; researchers watch, or start agent runs.
    exits: {south: watch_room}

  # ---- The gallery: the instruments ----
  - id: gallery_instruments
    name: Gallery, by the instruments
    floor: ground
    at: [4, 6]
    summary: The front of the gallery, between the instruments.
    exits: {south: entrance_hall, west: observatory, east: lens_workshop, north: gallery_records}
  - id: observatory
    name: Observatory
    floor: ground
    at: [3, 6]
    opens: observatory
    summary: Read a lens across its layers, with the Sankeys, the 3-D view, members, the output table, pipelines and hubs, fingerprints, node details and the analysis panel.
    exits: {east: gallery_instruments, west: calibration_lab}
  - id: calibration_lab
    name: Calibration lab
    floor: ground
    at: [2, 6]
    stage: suggested
    summary: >-
      Where the instruments are checked before they are trusted: self-checks on planted data,
      decoys, held-out tests, UMAP against raw space, and the analysts' tests.
    exits: {east: observatory}
  - id: lens_workshop
    name: Lens workshop
    floor: ground
    at: [5, 6]
    opens: workshop
    summary: Make and judge lenses, with the form, the preview, comparisons, validation, tuning, the axes and mass-mean lenses.
    exits: {west: gallery_instruments, east: scanner}
  - id: scanner
    name: Scanner room
    floor: ground
    at: [6, 6]
    stage: suggested
    summary: >-
      The MRI's scanner, where captures are made: new captures of sentence sets and scenarios, the
      queue for the GPU, and each capture's recipe (slice 2).
    exits: {west: lens_workshop}

  # ---- The gallery: the records ----
  - id: gallery_records
    name: Gallery, by the records
    floor: ground
    at: [4, 5]
    summary: The middle of the gallery, between the studies and the atlas.
    exits: {south: gallery_instruments, west: studies_room, east: atlas, north: gallery_paradigm}
  - id: studies_room
    name: Studies room
    floor: ground
    at: [3, 5]
    opens: studies
    summary: Every study, with its question, sets, captures, lenses, findings, ledger, status, showcase and the department that holds it.
    exits: {east: gallery_records, west: scaffold_studio}
  - id: scaffold_studio
    name: Scaffold studio
    floor: ground
    at: [2, 5]
    stage: suggested
    summary: >-
      Scaffold studies, the project's main aim: the scaffold catalogue, and one lens read with and
      without a scaffold side by side, to see how the scaffold moves the model's representations and
      its behaviour (slice 8).
    exits: {east: studies_room}
  - id: atlas
    name: Atlas
    floor: ground
    at: [5, 5]
    stage: later
    summary: The catalogues of the nodes, experts and routes found across every capture, each entry with its report (slice 6).
    exits: {west: gallery_records, east: intervention_lab}
  - id: intervention_lab
    name: Intervention lab
    floor: ground
    at: [6, 5]
    stage: suggested
    summary: >-
      Steering, ablation and expert masks, with the baseline beside the changed run: the check that
      a node causes what it seems to (slice 8).
    exits: {west: atlas}

  # ---- The gallery: the paradigm ----
  - id: gallery_paradigm
    name: Gallery, by the paradigm
    floor: ground
    at: [4, 4]
    summary: The back of the gallery, between the meeting room and the paradigm hall.
    exits: {south: gallery_records, west: meeting_room, east: paradigm_hall, north: crossing}
  - id: meeting_room
    name: Meeting room
    floor: ground
    at: [3, 4]
    opens: meeting
    summary: Where the AIs meet, mainly to add to the paradigm; their agenda and record come with the AI scientists (slice 11).
    exits: {east: gallery_paradigm}
  - id: paradigm_hall
    name: Paradigm hall
    floor: ground
    at: [5, 4]
    stage: suggested
    summary: >-
      The paradigm itself: the accepted findings, each with its evidence, its strength and the
      votes on it. A finding proposed in the meeting room comes here once accepted (slice 11).
    exits: {west: gallery_paradigm}

  # ---- The departments, at the back ----
  - id: crossing
    name: Department crossing
    floor: ground
    at: [4, 3]
    summary: Where the gallery ends, with a department on each side.
    exits: {south: gallery_paradigm, west: linguistics, east: mech_interp, northwest: alignment,
            northeast: discordant, north: researchers_offices}
  - id: researchers_offices
    name: Researchers' offices
    floor: ground
    at: [4, 2]
    stage: later
    summary: Rooms for the people who join the research.
    exits: {south: crossing}
  - id: linguistics
    name: Linguistics
    floor: ground
    at: [3, 3]
    department: linguistics
    opens: department
    summary: The linguistics department, with its studies, its boards and its AI scientists.
    exits: {east: crossing, west: polysemy_lab, northwest: linguistics_sim}
    characters:
      - id: linguistics_scientists
        name: The linguistics AI scientists
        note: Written with the new app (step 4); their minds come with slice 11.
  - id: polysemy_lab
    name: Polysemy lab
    floor: ground
    at: [2, 3]
    department: linguistics
    opens: lab
    summary: Today's polysemy lab, kept. The tank lens and the five senses of "tank"; entering it opens its capture and lens in the app.
    exits: {east: linguistics}
  - id: linguistics_sim
    name: Linguistics simulation room
    floor: ground
    at: [2, 2]
    department: linguistics
    opens: simulation
    summary: The department's own simulation room.
    exits: {southeast: linguistics}
  - id: alignment
    name: Alignment
    floor: ground
    at: [3, 2]
    department: alignment
    opens: department
    summary: The alignment department, with its studies and boards.
    exits: {southeast: crossing, north: alignment_sim}
    characters:
      - id: alignment_scientists
        name: The alignment AI scientists
        note: Written with the new app (step 4); their minds come with slice 11.
  - id: alignment_sim
    name: Alignment simulation room
    floor: ground
    at: [3, 1]
    department: alignment
    opens: simulation
    summary: The department's own simulation room.
    exits: {south: alignment}
  - id: mech_interp
    name: General mechanistic interpretability
    floor: ground
    at: [5, 3]
    department: mech_interp
    opens: department
    summary: The department of general mechanistic interpretability, with its studies and boards.
    exits: {west: crossing, east: mech_interp_sim}
    characters:
      - id: mech_interp_scientists
        name: The mechanistic interpretability AI scientists
        note: Written with the new app (step 4); their minds come with slice 11.
  - id: mech_interp_sim
    name: Mechanistic interpretability simulation room
    floor: ground
    at: [6, 3]
    department: mech_interp
    opens: simulation
    summary: The department's own simulation room.
    exits: {west: mech_interp}
  - id: discordant
    name: Discordant studies
    floor: ground
    at: [5, 2]
    department: discordant
    opens: department
    summary: The department of discordant studies, with its studies and boards.
    exits: {southwest: crossing, north: discordant_sim, east: ideas_room}
    characters:
      - id: discordant_scientists
        name: The discordant studies AI scientists
        note: Written with the new app (step 4); their minds come with slice 11.
  - id: discordant_sim
    name: Discordant studies simulation room
    floor: ground
    at: [5, 1]
    department: discordant
    opens: simulation
    summary: The department's own simulation room.
    exits: {south: discordant}
  - id: ideas_room
    name: Ideas
    floor: ground
    at: [6, 2]
    department: discordant
    stage: later
    summary: The Ideas workspace with its idea-tracking engine, in discordant studies.
    exits: {west: discordant}

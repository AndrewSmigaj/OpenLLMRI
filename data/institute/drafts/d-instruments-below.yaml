# Draft D for the second polishing pass (2026-10-24): two floors, the instruments below and the
# departments above. Claude's draft, for Andrew to pick from with drafts A, B and C. Rooms marked
# `stage: suggested` are Claude's suggestions, for Andrew to keep or veto; `stage: later` marks
# rooms the design already plans for later. The rules are those of data/institute/layout.yaml.

version: 1
title: "D · Two floors: instruments below, departments above"
about: >-
  The ground floor is where things are made: the public rooms and the simulation rooms around the
  entrance, and behind them a gallery of the instruments in the order the work runs (the scanner,
  the lens workshop, the observatory, the atlas), with the calibration lab beside them. Upstairs is
  where the findings are argued over: the studies room in the middle with the four departments
  around it, the meeting room and the paradigm hall behind, and the scaffold studio and the
  intervention lab at the top of the stairs. The stairs further up are out of service.

floors:
  - id: ground
    name: Ground floor
    note: the public rooms and the instruments
  - id: first
    name: First floor
    note: the departments and the paradigm

departments:
  - id: linguistics
    name: Linguistics
  - id: mech_interp
    name: General mechanistic interpretability
  - id: alignment
    name: Alignment
  - id: discordant
    name: Discordant studies

rooms:
  # ---- Ground floor: at the entrance ----
  - id: entrance_hall
    name: Entrance hall
    floor: ground
    at: [3, 4]
    opens: entrance
    summary: Where everyone arrives, with the greeter, the map of the institute and the quick-jump box. Today's hub.
    exits: {west: lounge, east: simulator, northwest: public_sim_1, northeast: public_sim_2,
            north: instruments_gallery}
    characters:
      - id: greeter
        name: The greeter
        note: An AI with a form, who meets visitors and points them to the rooms. Its mind comes with the AI scientists (slice 11).
  - id: lounge
    name: Lounge
    floor: ground
    at: [2, 4]
    summary: A place to spend time and talk, with people and with the AIs. It has no tools.
    exits: {east: entrance_hall, west: library}
  - id: library
    name: Library
    floor: ground
    at: [1, 4]
    opens: library
    summary: The sentence sets with their guides and audits, the scenario sets, the captures and the saved lenses; later the builder for sets and scenarios.
    exits: {east: lounge}
  - id: simulator
    name: Simulator
    floor: ground
    at: [4, 4]
    opens: simulation
    summary: Today's simulator, kept. Every scenario set in the library is loaded and played from here.
    exits: {west: entrance_hall, east: watch_room}
  - id: watch_room
    name: Watch room
    floor: ground
    at: [5, 4]
    stage: suggested
    summary: >-
      Follow agent runs as they play, each run's lens readings step by step beside its game text and
      reasoning, with an alert when a run enters a state being watched (Watch, slice 4). It sits
      beside the simulation rooms, so a run can be watched next to where it plays.
    exits: {west: simulator, northwest: public_sim_2, north: public_sim_3}
  - id: public_sim_1
    name: Public simulation room 1
    floor: ground
    at: [2, 3]
    opens: simulation
    summary: Visitors play Winter Survival; researchers watch, or start agent runs.
    exits: {southeast: entrance_hall}
  - id: public_sim_2
    name: Public simulation room 2
    floor: ground
    at: [4, 3]
    opens: simulation
    summary: Visitors play Winter Survival; researchers watch, or start agent runs.
    exits: {southwest: entrance_hall, southeast: watch_room}
  - id: public_sim_3
    name: Public simulation room 3
    floor: ground
    at: [5, 3]
    opens: simulation
    summary: Visitors play Winter Survival; researchers watch, or start agent runs.
    exits: {south: watch_room}

  # ---- Ground floor: the instruments, in the order the work runs ----
  - id: instruments_gallery
    name: Instruments' gallery
    floor: ground
    at: [3, 2]
    summary: The gallery behind the entrance hall, with the instruments around it and the stairs up.
    exits: {south: entrance_hall, west: lens_workshop, east: observatory, north: calibration_lab,
            northwest: scanner, northeast: atlas, up: first_landing}
  - id: scanner
    name: Scanner room
    floor: ground
    at: [2, 1]
    stage: suggested
    summary: >-
      The MRI's scanner, where captures are made: new captures of sentence sets and scenarios, the
      queue for the GPU, and each capture's recipe (slice 2). The first step of the work.
    exits: {southeast: instruments_gallery, south: lens_workshop}
  - id: lens_workshop
    name: Lens workshop
    floor: ground
    at: [2, 2]
    opens: workshop
    summary: Make and judge lenses, with the form, the preview, comparisons, validation, tuning, the axes and mass-mean lenses.
    exits: {east: instruments_gallery, north: scanner}
  - id: observatory
    name: Observatory
    floor: ground
    at: [4, 2]
    opens: observatory
    summary: Read a lens across its layers, with the Sankeys, the 3-D view, members, the output table, pipelines and hubs, fingerprints, node details and the analysis panel.
    exits: {west: instruments_gallery, north: atlas}
  - id: atlas
    name: Atlas
    floor: ground
    at: [4, 1]
    stage: later
    summary: The catalogues of the nodes, experts and routes found across every capture, each entry with its report (slice 6).
    exits: {southwest: instruments_gallery, south: observatory}
  - id: calibration_lab
    name: Calibration lab
    floor: ground
    at: [3, 1]
    stage: suggested
    summary: >-
      Where the instruments are checked before they are trusted: self-checks on planted data,
      decoys, held-out tests, UMAP against raw space, and the analysts' tests.
    exits: {south: instruments_gallery}

  # ---- First floor: the departments and the paradigm ----
  - id: first_landing
    name: First-floor landing
    floor: first
    at: [3, 4]
    summary: Where the stairs arrive, between the scaffold studio and the intervention lab.
    exits: {down: instruments_gallery, north: studies_room, west: scaffold_studio, east: intervention_lab}
    closed:
      up: The stairs up are out of service; the floor above is closed.
  - id: scaffold_studio
    name: Scaffold studio
    floor: first
    at: [2, 4]
    stage: suggested
    summary: >-
      Scaffold studies, the project's main aim: the scaffold catalogue, and one lens read with and
      without a scaffold side by side, to see how the scaffold moves the model's representations and
      its behaviour (slice 8).
    exits: {east: first_landing}
  - id: intervention_lab
    name: Intervention lab
    floor: first
    at: [4, 4]
    stage: suggested
    summary: >-
      Steering, ablation and expert masks, with the baseline beside the changed run: the check that
      a node causes what it seems to (slice 8).
    exits: {west: first_landing}
  - id: studies_room
    name: Studies room
    floor: first
    at: [3, 3]
    opens: studies
    summary: Every study, with its question, sets, captures, lenses, findings, ledger, status, showcase and the department that holds it. The departments open off it.
    exits: {south: first_landing, west: linguistics, east: mech_interp, northwest: alignment,
            northeast: discordant, north: meeting_room}
  - id: meeting_room
    name: Meeting room
    floor: first
    at: [3, 2]
    opens: meeting
    summary: Where the AIs meet, mainly to add to the paradigm; their agenda and record come with the AI scientists (slice 11).
    exits: {south: studies_room, north: paradigm_hall, northwest: researchers_offices}
  - id: paradigm_hall
    name: Paradigm hall
    floor: first
    at: [3, 1]
    stage: suggested
    summary: >-
      The paradigm itself: the accepted findings, each with its evidence, its strength and the
      votes on it. A finding proposed in the meeting room comes here once accepted (slice 11).
    exits: {south: meeting_room}
  - id: researchers_offices
    name: Researchers' offices
    floor: first
    at: [2, 1]
    stage: later
    summary: Rooms for the people who join the research.
    exits: {southeast: meeting_room}
  - id: linguistics
    name: Linguistics
    floor: first
    at: [2, 3]
    department: linguistics
    opens: department
    summary: The linguistics department, with its studies, its boards and its AI scientists.
    exits: {east: studies_room, west: polysemy_lab, southwest: linguistics_sim}
    characters:
      - id: linguistics_scientists
        name: The linguistics AI scientists
        note: Written with the new app (step 4); their minds come with slice 11.
  - id: polysemy_lab
    name: Polysemy lab
    floor: first
    at: [1, 3]
    department: linguistics
    opens: lab
    summary: Today's polysemy lab, kept. The tank lens and the five senses of "tank"; entering it opens its capture and lens in the app.
    exits: {east: linguistics}
  - id: linguistics_sim
    name: Linguistics simulation room
    floor: first
    at: [1, 4]
    department: linguistics
    opens: simulation
    summary: The department's own simulation room.
    exits: {northeast: linguistics}
  - id: alignment
    name: Alignment
    floor: first
    at: [2, 2]
    department: alignment
    opens: department
    summary: The alignment department, with its studies and boards.
    exits: {southeast: studies_room, west: alignment_sim}
    characters:
      - id: alignment_scientists
        name: The alignment AI scientists
        note: Written with the new app (step 4); their minds come with slice 11.
  - id: alignment_sim
    name: Alignment simulation room
    floor: first
    at: [1, 2]
    department: alignment
    opens: simulation
    summary: The department's own simulation room.
    exits: {east: alignment}
  - id: mech_interp
    name: General mechanistic interpretability
    floor: first
    at: [4, 3]
    department: mech_interp
    opens: department
    summary: The department of general mechanistic interpretability, with its studies and boards.
    exits: {west: studies_room, east: mech_interp_sim}
    characters:
      - id: mech_interp_scientists
        name: The mechanistic interpretability AI scientists
        note: Written with the new app (step 4); their minds come with slice 11.
  - id: mech_interp_sim
    name: Mechanistic interpretability simulation room
    floor: first
    at: [5, 3]
    department: mech_interp
    opens: simulation
    summary: The department's own simulation room.
    exits: {west: mech_interp}
  - id: discordant
    name: Discordant studies
    floor: first
    at: [4, 2]
    department: discordant
    opens: department
    summary: The department of discordant studies, with its studies and boards.
    exits: {southwest: studies_room, east: discordant_sim, north: ideas_room}
    characters:
      - id: discordant_scientists
        name: The discordant studies AI scientists
        note: Written with the new app (step 4); their minds come with slice 11.
  - id: discordant_sim
    name: Discordant studies simulation room
    floor: first
    at: [5, 2]
    department: discordant
    opens: simulation
    summary: The department's own simulation room.
    exits: {west: discordant}
  - id: ideas_room
    name: Ideas
    floor: first
    at: [4, 1]
    department: discordant
    stage: later
    summary: The Ideas workspace with its idea-tracking engine, in discordant studies.
    exits: {south: discordant}

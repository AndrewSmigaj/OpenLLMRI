# The institute's floor plan (ROOM-16), approved by Andrew on 2026-10-27. The app draws its map
# from this file and the MUD builds the institute from it (the new app, step 3).
#
# The grid: columns from left to right and rows from the back of the building to the front, each
# with its own size in metres, so corridors are narrow and rooms are wide. Each room is a rectangle
# of grid cells, `area: [first column, first row, last column, last row]`; the rooms fill the grid,
# so the building is one rectangle. `doors` lists the pairs of rooms joined by a door, and every door
# sits in a wall the two rooms share. A department's other rooms open only from inside it.

version: 2
title: The institute
about: >-
  Visitors' rooms at the front: the entrance hall, the three public simulation rooms together on
  its left, the library on its right, and the lounge just behind it. The shared research rooms are
  in the middle, around a short central corridor. The four departments sit together along the
  back, on their own corridor, each with its private rooms behind it.

grid:
  columns: [6, 6, 6, 6, 2.4, 6, 6, 6, 6]
  rows: [4, 4, 2.4, 4, 4, 4, 4, 4]

departments:
  - id: linguistics
    name: Linguistics
  - id: mech_interp
    name: General mechanistic interpretability
  - id: alignment
    name: Alignment
  - id: discordant
    name: Discordant studies

entrance: entrance_hall

rooms:
  # ---- The front: what visitors use ----
  - id: entrance_hall
    name: Entrance hall
    area: [3, 5, 5, 7]
    opens: entrance
    summary: Where everyone arrives, with the greeter, the map of the institute and the quick-jump box.
    notes: [The stairs up are out of service; the floor above is closed.]
    characters:
      - id: greeter
        name: The greeter
        note: An AI with a form, who meets visitors and points them to the rooms. Its mind comes with the AI scientists (slice 11).
  - id: public_sim_1
    name: Public simulation room 1
    area: [0, 5, 2, 5]
    opens: simulation
    summary: Visitors play Winter Survival; researchers watch, or start agent runs.
  - id: public_sim_2
    name: Public simulation room 2
    area: [0, 6, 2, 6]
    opens: simulation
    summary: Visitors play Winter Survival; researchers watch, or start agent runs.
  - id: public_sim_3
    name: Public simulation room 3
    area: [0, 7, 2, 7]
    opens: simulation
    summary: Visitors play Winter Survival; researchers watch, or start agent runs.
  - id: library
    name: Library
    area: [6, 5, 8, 7]
    opens: library
    summary: The papers and articles we write.
  - id: lounge
    name: Lounge
    area: [2, 4, 3, 4]
    summary: A place to spend time and talk, with people and with the AIs.

  # ---- The middle: the shared research rooms ----
  - id: central_corridor
    name: Central corridor
    area: [4, 3, 4, 4]
    corridor: true
    summary: From the entrance hall to the departments, between the shared rooms.
  - id: observatory
    name: Observatory
    area: [2, 3, 3, 3]
    opens: observatory
    summary: Read a lens across its layers, with the Sankeys, the 3-D view, members, the output table, pipelines and hubs, fingerprints, node details and the analysis panel.
  - id: lens_workshop
    name: Lens workshop
    area: [5, 3, 6, 3]
    opens: workshop
    summary: Make lenses and judge them, with the form, the preview, comparisons, validation, tuning, the axes and mass-mean lenses.
  - id: studies_room
    name: Studies room
    area: [5, 4, 6, 4]
    opens: studies
    summary: Every study, with its question, its sentence sets or scenarios, captures, lenses, findings and ledger.
  - id: meeting_room
    name: Meeting room
    area: [0, 3, 1, 4]
    opens: meeting
    summary: Where the AIs meet, mainly to add to the paradigm, and to plan work that crosses departments, such as scaffolds.
  - id: scaffold_studio
    name: Scaffold studio
    area: [7, 3, 8, 4]
    summary: Scaffold studies; its tools come with slice 8.

  # ---- The back: the departments ----
  - id: department_corridor
    name: Department corridor
    area: [0, 2, 8, 2]
    corridor: true
    summary: The corridor along the departments.
  - id: linguistics
    name: Linguistics
    area: [0, 1, 1, 1]
    department: linguistics
    opens: department
    summary: The linguistics department, with its studies, its boards and its AI scientists.
    characters:
      - id: linguistics_scientists
        name: The linguistics AI scientists
        note: Written with the new app (step 4); their minds come with slice 11.
  - id: polysemy_lab
    name: Polysemy lab
    area: [0, 0, 0, 0]
    department: linguistics
    opens: lab
    summary: The tank lens and the five senses of "tank"; entering it opens its capture and lens in the app.
  - id: linguistics_sim
    name: Linguistics simulation room
    area: [1, 0, 1, 0]
    department: linguistics
    opens: simulation
    summary: The department's own simulation room.
  - id: mech_interp
    name: General mechanistic interpretability
    area: [2, 1, 4, 1]
    department: mech_interp
    opens: department
    summary: The department of general mechanistic interpretability, with its studies, its boards and its AI scientists.
    characters:
      - id: mech_interp_scientists
        name: The mechanistic interpretability AI scientists
        note: Written with the new app (step 4); their minds come with slice 11.
  - id: mech_interp_sim
    name: Mechanistic interpretability simulation room
    area: [2, 0, 4, 0]
    department: mech_interp
    opens: simulation
    summary: The department's own simulation room.
  - id: alignment
    name: Alignment
    area: [5, 1, 6, 1]
    department: alignment
    opens: department
    summary: The alignment department, with its studies, its boards and its AI scientists.
    characters:
      - id: alignment_scientists
        name: The alignment AI scientists
        note: Written with the new app (step 4); their minds come with slice 11.
  - id: alignment_sim
    name: Alignment simulation room
    area: [5, 0, 6, 0]
    department: alignment
    opens: simulation
    summary: The department's own simulation room.
  - id: discordant
    name: Discordant studies
    area: [7, 1, 8, 1]
    department: discordant
    opens: department
    summary: The department of discordant studies, with its studies, its boards and its AI scientists.
    characters:
      - id: discordant_scientists
        name: The discordant studies AI scientists
        note: Written with the new app (step 4); their minds come with slice 11.
  - id: discordant_sim
    name: Discordant studies simulation room
    area: [7, 0, 8, 0]
    department: discordant
    opens: simulation
    summary: The department's own simulation room.

doors:
  # the entrance hall
  - [entrance_hall, public_sim_1]
  - [entrance_hall, public_sim_2]
  - [entrance_hall, public_sim_3]
  - [entrance_hall, library]
  - [entrance_hall, lounge]
  - [entrance_hall, central_corridor]
  # the central corridor
  - [central_corridor, observatory]
  - [central_corridor, lens_workshop]
  - [central_corridor, studies_room]
  - [central_corridor, department_corridor]
  # the department corridor
  - [department_corridor, meeting_room]
  - [department_corridor, scaffold_studio]
  - [department_corridor, linguistics]
  - [department_corridor, mech_interp]
  - [department_corridor, alignment]
  - [department_corridor, discordant]
  # inside the departments
  - [linguistics, polysemy_lab]
  - [linguistics, linguistics_sim]
  - [mech_interp, mech_interp_sim]
  - [alignment, alignment_sim]
  - [discordant, discordant_sim]

  built: no
  dates: [2026-10-07]
  source: L6
  from: [839]
  section: design.md#watch
- id: WATCH-6
  text: >-
    Which token each panel uses, for now: a lens lights up in a tick only when its strongest token
    beats the strongest token in neutral text of the same length; its path is drawn from the output
    keyword (or the strongest token, said so, when there is none); clicking any heatmap cell or
    token switches the panels to that token, drawn over the faded calibration flows.
  status: decided
  built: no
  dates: [2026-10-07]
  source: L6
  from: [851]
  section: design.md#watch
- id: WATCH-7
  text: >-
    Replay: play, pause and step through a recorded run tick by tick, with the heatmap, the panels,
    the text and the MUD transcript moving together.
  status: decided
  built: no
  dates: [2026-10-07]
  source: L6
  from: [864]
  section: design.md#watch
- id: WATCH-8
  text: >-
    Branch from any tick: replay up to a tick, change one thing (the observation, a scaffold or a
    steering vector) and let the model continue; the branch is a new run and a condition, started
    through Claude Code or the MUD, and opens side by side with the original.
  status: decided
  built: no
  dates: [2026-10-08]
  source: Part M
  from: [868]
  section: design.md#watch
- id: WATCH-9
  text: >-
    A reading explains itself: hovering a lit cell shows the lens's calibration sentences closest to
    that state.
  status: decided
  built: no
  dates: [2026-10-07]
  source: L6
  from: [873]
  section: design.md#watch
- id: WATCH-10
  text: >-
    Bookmarks: a moment marked with a note, saved into the study's files, where analyst agents read
    it as evidence.
  status: decided
  built: no
  dates: [2026-10-07]
  source: L6
  from: [877]
  section: design.md#watch
- id: WATCH-11
  text: >-
    Side by side: two runs with their ticks aligned, such as a scenario with and without steering,
    ablation or a scaffold, or played by two different agents.
  status: decided
  built: no
  dates: [2026-10-07]
  source: L6
  from: [881]
  section: design.md#watch
- id: WATCH-12
  text: >-
    Live alerts: when a chosen lens lights up, or a reading is still between the classes at the
    output; the first step toward monitoring agents. Alerts are judged per run, by how many runs
    they catch at an acceptable false-alarm rate, not by AUROC alone.
  status: decided
  built: no
  dates: [2026-10-07, 2026-10-08]
  source: L6; Part M
  from: [887, 891]
  section: design.md#watch
- id: WATCH-13
  text: >-
    A run in progress opens like a finished run: each tick appears once saved, with its keyword
    readings; the scan never slows the agent; alerts fire as soon as their readings exist; the
    agent's play is watched in the MUD.
  status: decided
  built: no
  dates: [2026-10-07]
  source: L13
  from: [895]
  section: design.md#watch
- id: WATCH-14
  text: >-
    What Watch needs: the runner captures the kit's keywords in each action and stores each tick's
    token ids; the scan runs by replay or during the runner's capture pass, whichever is cheaper,
    and stores only the readings; each lens has a neutral baseline, a chance level for the strongest
    token and a nearest-neighbour index over its calibration states; readings are computed once and
    stored.
  status: decided
  built: no
  dates: [2026-10-07]
  source: design review
  from: [910]
  section: design.md#watch

- id: WATCH-15
  text: >-
    Watch's risks and what answers them: the scan compares each token with the same token in
    neutral text; lighting up is judged against the chance level; presence tells a torn reading from
    an absent concept; the heatmap shows raw readings by default, and with references Advanced shows
    them against the bands; a lens not yet validated where it is read carries the exploratory badge;
    heatmap rows group and fold, empty rows hide, and lens panels sort and dim.
  status: decided
  built: no
  dates: [2026-10-07]
  source: L6 (approved with Watch's layout)
  from: []
  section: design.md#watch

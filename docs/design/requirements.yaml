  built: no
  dates: [2026-10-07]
  source: time review
  from: [836]
  section: design.md#watch
- id: WATCH-5
  text: >-
    The lens panels: as many as wanted, one lens per panel; each shows its lens's cluster Sankey with
    a toggle to its expert Sankey; panels sort by how strongly their lens is present in the selected
    tick, pinned panels stay on top and absent ones dim; a mass-mean lens gets a three-bin Sankey; all
    24 layers scroll sideways together across panels.

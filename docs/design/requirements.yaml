  built: yes
  dates: [2026-10-06]
  source: message
  from: [381]
  section: design.md#lenses
- id: LENS-4
  text: >-
    Raw-space groupings are designed carefully and compared with UMAP.
  status: decided
  built: yes
  dates: [2026-10-06]
  source: message
  from: [382]
  section: design.md#lenses
- id: LENS-5
  text: >-
    Standardized PCA: centre, standardize each neuron, reduce to 50 dimensions, then cluster with
    Ward or spectral clustering (the best raw-space method in the 2026-10-06 comparison).
  status: decided
  built: yes
  dates: [2026-10-07]
  source: design review
  from: [384]
  section: design.md#lenses
- id: LENS-6
  text: >-
    Relevant-neuron PCA, a third grouping: keep the neurons most associated with the set's
    classes, then reduce them with PCA, so the axes are weighted sums of named neurons and a new
    token is read by a linear projection. Because the classes choose the neurons, they are chosen
    inside each training fold, judged only held out, and compared with the supervised ceiling,
    never with unsupervised groupings.
  status: decided
  built: yes
  dates: [2026-10-07]
  source: L8
  from: [386]
  section: design.md#lenses
- id: LENS-7
  text: >-

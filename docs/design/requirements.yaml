# ---- WATCH: following agent runs ----
- id: WATCH-1
  text: >-
    Watch shows which representations are active over time: for each scenario set its own panel of
    lenses; a lens heatmap in which every token is scanned through each lens (most sentences show
    nothing); each lens also read at the output, at keywords from the scenario's MUD commands; for
    each lens its own Sankeys; lens panels, as many as wanted; replay, explained readings,
    bookmarks, runs side by side and live alerts; good use of screen space.
  status: decided
  built: no
  dates: [2026-10-07]
  source: message; L6
  from: [778]
  section: design.md#watch
- id: WATCH-2
  text: >-
    Watch's layout: the lens heatmap on top, the lens panels below it, and a side drawer (the run's

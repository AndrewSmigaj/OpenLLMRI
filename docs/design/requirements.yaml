- id: GOAL-15
  text: >-
    The lens catalogue starts with about twelve lenses across levels of language: grammar (tense,
    number agreement), meaning (the senses of "tank", animacy, an animal taxonomy), pragmatics
    (irony), feeling (positive or negative), social (friend or foe, intent), knowledge (fact or
    fiction), safety (harmful or harmless request) and reasoning (negation). Some have published
    results on other models, which benchmarks the instrument, and the breadth gives each team of AI
    scientists a start.
  status: decided
  built: partly
  dates: [2026-10-08]
  source: Part M
  from: [204]

# ---- SET: sentence sets, how they are written and audited ----
- id: SET-1
  text: >-
    A sentence set is sentences that vary designed axes and hold the rest fixed, captured at a
    target word or a carrier.
  status: built
  built: yes
  dates: []
  source: ""
  from: [265]
  section: design.md#sets
- id: SET-2
  text: >-
    A set can be as small as single words, as a team studying grammar might use.
  status: decided
  built: yes
  dates: [2026-10-06]
  source: message
  from: [267]
  section: design.md#sets
- id: SET-3
  text: >-
    A single word is given as the user's message with a space before it, so it is one token for
    nearly every common word: the same token the word has inside a sentence.
  status: decided
  built: yes
  dates: [2026-10-08]
  source: message
  from: [269]
  section: design.md#sets
- id: SET-4
  text: >-
    A word that splits into several tokens is read at its last token, which has taken in the whole
    word. Whether it split is recorded and balanced across classes, and the analysis checks whether
    early layers group split words by their last piece (goldfish, catfish and starfish all end in
    "fish").
  status: decided
  built: yes
  dates: [2026-10-09]
  source: message
  from: [273]
  section: design.md#sets
- id: SET-5
  text: >-
    The capture tries a word's one-token forms first and reads a split form only when they aren't
    in the sentence, so captures of words that don't split keep their tokens.
  status: decided
  built: yes
  dates: [2026-10-11]
  source: L16.3
  from: [282]
  section: design.md#sets
- id: SET-6
  text: >-
    A single word stays read at its last token, and the gap between one-token and split names is
    handled in the sets and the analyses. Read there, the two kinds of name sit apart at every
    layer; the token after the word was tested and carries the meaning much more weakly.
  status: decided
  built: partly
  dates: [2026-10-11]
  source: L16.7
  from: [284]
  section: design.md#sets
- id: SET-7
  text: >-
    How the gap is handled in the analyses: they compare within each token count (balancing split
    names across the classes is SET-4).
  status: proposed
  built: partly
  dates: [2026-10-09]
  source: Claude
  from: [286]
  section: design.md#sets
- id: SET-8
  text: >-
    The first single-word set varies meaning and feeling: a semantic category with subcategories,
    animacy and concreteness, and valence. Grammar and surface form aren't varied, so it holds
    singular nouns, and its subcategories are its held-out families.
  status: decided
  built: yes
  dates: [2026-10-08]
  source: message; the slice 1b plan (singular nouns, subcategories as families)
  from: [289]
  section: design.md#sets
- id: SET-9
  text: >-
    Two more single-word sets: animals, and harmful, dual-purpose and benign objects.
  status: decided
  built: yes
  dates: [2026-10-09]
  source: message
  from: [294]
  section: design.md#sets
- id: SET-10
  text: >-
    Each animal carries its taxonomy (class, order, family and genus) and its way of life
    (habitat, how it moves, diet, wild or domestic).
  status: decided
  built: yes
  dates: [2026-10-09]
  source: message
  from: [297]
  section: design.md#sets
- id: SET-11
  text: >-
    The animal set framed as a contest between kinship by descent and way of life, around animals
    where the two disagree (Claude's recommended option, which Andrew picked).
  status: retired
  built: yes
  dates: [2026-10-09, 2026-10-11]
  source: message (2026-10-09); L16.1 and L16.6 (2026-10-11)
  from: []
  section: design.md#retired
  replaced_by: [SET-12, SET-15]
- id: SET-12
  text: >-
    Many ways of organizing animals, not one framing: each animal gets a label in many ways, a
    small ontology of the animal words, so the space is explored rather than fitted to one framing
    chosen in advance. Claude looks into ways of organizing animals and proposes some; the model's
    states then show which ones it follows most, as evidence for that way.
  status: decided
  built: partly
  dates: [2026-10-11]
  source: L16.1, L16.6
  from: [301]
  section: design.md#sets
- id: SET-13
  text: >-
    Claude gives the reasons the first animal set centred on descent against way of life
    (docs/research/animal_ontology.md).
  status: decided
  built: yes
  dates: [2026-10-11]
  source: L16.6
  from: [301]
  section: design.md#sets
- id: SET-14
  text: >-
    People group animals for practical reasons: an animal seen for a moment is identified from a
    few cues.
  status: view
  dates: [2026-10-11]
  source: L16.1
  from: [311]
  section: design.md#sets
- id: SET-15
  text: >-
    The animal ontology: all 524 names labelled in nine ways (fourteen axes): descent (the group
    of eight and the taxonomic order); everyday kind (beast, bird, fish-like, snake-like,
    lizard-like, bug, shellfish, worm-like, sea creature); body covering (fur or hair, feathers,
    scales, bare skin, shell or hard case, soft body); size (tiny, small, medium, large, huge, by
    typical adult weight); legs (none, two, four, six, eight, more than eight); where people meet
    it (home, farm, town and gardens, countryside, sea or shore, far away); relation to people
    (companion, kept for work or food, dangerous, pest, wild); danger to people (harmless, can
    hurt, can kill) and how people feel about it (liked, neutral, feared or disliked); way of life
    (habitat, movement, diet, wild or domestic).
  status: decided
  built: yes
  dates: [2026-10-11]
  source: L27
  from: [314]
  section: design.md#sets
- id: SET-16
  text: >-
    A way of organizing leads at a layer when it accounts for more than any other way of which
    animals sit near each other there, with the other ways and the token count held fixed. Three
    measures judge it (neighbours beyond chance, held-out reading with whole orders left out, and
    each way's own share of the distances); every label is an axis to colour by in the app; the
    animals where the ways disagree are examples, not the frame.
  status: decided
  built: yes
  dates: [2026-10-11]
  source: L27
  from: [314]
  section: design.md#sets
- id: SET-17
  text: >-
    Claude labels the 524 names by hand and captures them again; a lens, the analyses and a
    findings note follow, alongside the two documents, mostly while Andrew reviews them.
  status: decided
  built: yes
  dates: [2026-10-11]
  source: L27
  from: [314]
  section: plan.md#phases
- id: SET-18
  text: >-
    The animal set holds 524 one-word names, each entered with the narrowest taxon that holds what
    it commonly names, or the one species it most commonly means (salmon, Salmo salar).
  status: decided
  built: yes
  dates: [2026-10-11]
  source: L28
  from: [344]
  section: design.md#sets
- id: SET-19
  text: >-
    The taxa are the Catalogue of Life's (a bat is the order Chiroptera, so it has no family or
    genus), and a name whose kinds span several classes is left out.
  status: proposed
  built: yes
  dates: [2026-10-09]
  source: Claude
  from: [347]
  section: design.md#sets
- id: SET-20
  text: >-
    The animals' label is the familiar group of eight (mammal, bird, reptile, amphibian, fish,
    insect, arachnid, other invertebrate), kept as the descent axis but no longer the only

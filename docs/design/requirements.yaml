  text: >-
    A lens is a model: its configuration (settings and number of clusters) is tuned like any model
    until it separates the classes and classifies held-out data well. The tuning is a search over
    the settings and k of each layer, chosen by held-out AMI and scored on held-out families the
    search never saw.

# ---- BUILD: the builders ----
- id: BUILD-1
  text: >-
    One builder for sentence sets and scenarios: `claude -p` drafts a labelled text set or a
    scenario; you review it in a table beside its audits, edit or redraft it, and save it as a
    version. A friend/foe scenario gives the model the scene and the list of commands at each tick,
    so the builder can draft one.
  status: decided
  built: no
  dates: [2026-10-10, 2026-10-11]
  source: his idea (2026-10-10); L22
  from: [717]
  section: design.md#builder
- id: BUILD-2
  text: >-
    For scenarios the builder stays open to experiment: several authoring setups and teams of
    Claude agents can be tried until the scenarios meet their criteria, instead of a single bare
    request.
  status: decided
  built: no
  dates: [2026-10-11]
  source: L22
  from: [722]
  section: design.md#builder
- id: BUILD-3
  text: >-
    Teams of agents may write sentence sets too, each agent working across all the classes.
  status: decided
  built: no
  dates: [2026-10-11]
  source: L29
  from: [726]
  section: design.md#builder
- id: BUILD-4
  text: >-
    Later the builder also edits a study's design.
  status: decided
  built: no
  dates: [2026-10-11]
  source: L17.2
  from: [727]
  section: design.md#builder
- id: BUILD-5
  text: >-
    The sentence set builder and the scenario builder are the one builder's two halves.
  status: proposed
  built: no
  dates: [2026-10-11]
  source: Claude
  from: [729]
  section: design.md#builder
- id: BUILD-6
  text: >-
    The sentence set builder shows the instructions given to the authoring agents and the sets that
    come back. Its steps: describe the contrast (target word, classes, carrier, sentences per class,
    scene families, diversity rules); read and edit the brief; generate; review the sentences in a
    table beside the audits, editing or regenerating; save the set with a version and start its
    capture as a background job.
  status: decided
  built: no
  dates: [2026-10-07, 2026-10-11]
  source: message; L29
  from: [731]
  section: design.md#builder
- id: BUILD-7
  text: >-
    The scenario builder lists scenario sets and their versions; you edit a scenario's stages,
    actions and labels and validate them; it opens the MUD terminal with the command ready, so you
    play the scenario yourself (`simulate`) or start the agent on it (`agent run`) and runs still
    start in the MUD; Claude agents can draft scenarios to instructions; a mini-world builder comes
    later.
  status: decided
  built: no
  dates: [2026-10-07]
  source: message
  from: [742, 746]
  section: design.md#builder
- id: BUILD-8
  text: >-
    The lens builder: pick a capture; Basic holds UMAP's neighbours and dimensions, minimum distance
    and distance metric, k and a name; Advanced holds settings per layer, k per layer with the
    automatic suggestion and its method, the reduction and grouping methods, the hold-out design and
    filters; the build runs in the background and the new lens opens when ready; read the k profile
    and held-out scores, then save the lens with its site and keywords.
  status: decided
  built: partly
  dates: [2026-10-07, 2026-10-09, 2026-10-11]
  source: message; L16.5 (the hold-out design)
  from: [749, 752, 754, 757]
  section: design.md#builder

# ---- ATLAS: the atlas and the paradigm ----
- id: ATLAS-1
  text: >-
    The atlas has four catalogues, each entry with a report written by a Claude agent: nodes (every
    node of every validated lens, layer by layer), experts (all 24 × 32), routes (pipelines and
    hubs) and analysed scaffolds.
  status: decided
  built: partly
  dates: [2026-10-06, 2026-10-07]
  source: message
  from: [1202, 1204]
  section: design.md#atlas
- id: ATLAS-2
  text: >-
    Routes are built from all four of each token's experts, weighted by the model's own weights;
    the top-1 Sankey stays as one view of them.
  status: decided
  built: no
  dates: [2026-10-07]
  source: message
  from: [1208]
  section: design.md#atlas
- id: ATLAS-3
  text: >-
    Time adds node dynamics: how long runs stay in a node, what comes before and after it, and what
    the model does while in it; staying several steps shows a held state, crossing in one step a
    passage.
  status: decided
  built: no
  dates: [2026-10-07]
  source: design review
  from: [1211]
  section: design.md#atlas
- id: ATLAS-4
  text: >-
    Bringing the lenses' findings together into one coherent model is the hard part.
  status: decided
  built: no
  dates: [2026-10-07]
  source: message
  from: [1215]
  section: design.md#atlas
- id: ATLAS-5
  text: >-
    The paradigm is the accepted findings: AI scientists propose findings, attack them and give
    evidence; several models vote, and when most agree the finding goes to Andrew for review;
    knowledge consolidators extract the insights.
  status: decided
  built: no
  dates: [2026-10-04, 2026-10-06]
  source: message
  from: [1217]
  section: design.md#atlas
- id: ATLAS-6
  text: >-
    The accepted findings form a map, the shape of the coherent model: a finding is a fact about one
    atlas entry or a typed link between entries; the map lays the links over the atlas by the layer
    where each concept forms, drawn in the Atlas workspace, with the consolidators' story over it;
    contradictions show as clashing links; later the map is scored on how well it predicts what a
    new lens shows, never as a gate.
  status: decided
  built: no
  dates: [2026-10-07]
  source: design review
  from: [1221]
  section: design.md#atlas
- id: ATLAS-7
  text: >-
    Every fact and link carries its strength: supported, tested and absent, or untestable here.
  status: decided
  built: no
  dates: [2026-10-08]
  source: Part M
  from: [1230]
  section: design.md#atlas
- id: ATLAS-8
  text: >-
    The atlas is published as a static website (entries, reports, figures and the map), with the
    sentence sets, lens directions and summary readings on Hugging Face in formats others can load.
  status: decided
  built: no
  dates: [2026-10-08]
  source: Part M
  from: [1232]
  section: design.md#atlas
- id: ATLAS-9
  text: >-
    The kinds of link, each measured by its own tool: overlap (one saved lens reading another
    lens's data, with presence saying whether its concept is there at all); nesting (the levels of
    the k profile's hierarchy); order in depth (per-layer held-out scores); shared direction (the
    angle between two mass-mean axes); shared machinery (the expert and route catalogues, and
    expert fingerprints); use in decisions (behaviour by reading, and steering a node); changes
    (the condition comparison, against a scaffold's neutral texts); and steers routing (the routing
    effect of a lens's nodes on the next layer, and an axis's router alignment against random
    directions).
  status: decided
  built: no
  dates: [2026-10-07, 2026-10-08]
  source: design review; L14 (changes); Part M (steers routing)
  from: [1237, 1249]
  section: design.md#atlas

# ---- INT: interventions and conditions ----
- id: INT-1
  text: >-
    Steering and ablation, with behaviour studies.
  status: decided
  built: no
  dates: [2026-10-06]
  source: message
  from: [1253]
  section: design.md#interventions
- id: INT-2
  text: >-
    Steering a node and seeing what changes downstream; the push is told apart from its effects
    (whether the population stays in the other node at later layers or drifts back, and what else
    changes: other lenses, routes and behaviour).
  status: decided
  built: no
  dates: [2026-10-06, 2026-10-07]
  source: message
  from: [1254, 1255]
  section: design.md#interventions
- id: INT-3
  text: >-
    Scaffolds, and steering from outside and inside the model: how each changes trajectories.
  status: decided
  built: no
  dates: [2026-10-06]
  source: message
  from: [1260]
  section: design.md#interventions
- id: INT-4
  text: >-
    A condition is whatever differs between runs of the same set (a scaffold, a steering vector, an
    ablation, an expert mask, another model, a decoding setting, or a change at one tick of a
    branched run); all are compared the same way under one fixed lens, and each run records its
    condition.
  status: decided
  built: no
  dates: [2026-10-07, 2026-10-08]
  source: design review; Part M
  from: [1261, 1263]
  section: design.md#interventions
- id: INT-5
  text: >-
    Comparisons are fair: paired runs that share everything else; a same-size control without the
    content (random directions, random experts, two or three neutral texts of the same length and
    format for scaffolds); and dose, sweeping strength and layer.
  status: decided
  built: no
  dates: [2026-10-07]
  source: design review
  from: [1267]
  section: design.md#interventions
- id: INT-6
  text: >-
    How interventions are done: routing drift is always recorded; an option steers only in
    directions the routers don't use; expert masks go through the router's bias, which the 4-bit
    loading path reads on every call.
  status: decided
  built: no
  dates: [2026-10-07]
  source: design review
  from: [1276]
  section: design.md#interventions
- id: INT-7
  text: >-
    Replications are named as such: RARE's and SteerMoE's methods are cited and first reproduced on
    a published result, and one published gpt-oss result (game probes that stay accurate when the
    agents know they are watched) is replicated as a MUD scenario.
  status: decided
  built: no
  dates: [2026-10-08]
  source: Part M
  from: [1282]
  section: design.md#interventions
- id: INT-8
  text: >-
    A catalogue of analysed scaffolds, each with its reports and analyses (what it changes in each
    lens's readings and when, in routes, and in behaviour, against its neutral controls): the
    atlas's fourth catalogue, linked by "changes", with scaffolds as versioned files.
  status: decided
  built: no
  dates: [2026-10-07]
  source: L14
  from: [1287, 1289]
  section: design.md#interventions
- id: INT-9
  text: >-
    Another mixture-of-experts model, for comparison.
  status: decided
  built: no
  dates: [2026-10-06]
  source: message
  from: [1296]
  section: design.md#interventions


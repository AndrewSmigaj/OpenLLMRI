# ---- ARCH: architecture decisions (the plans Andrew approved, and Claude's new proposals) ----
- id: ARCH-1
  text: >-
    One repo on WSL's own disk holds the backend, the app, the MUD, the libraries and the records;
    the backend's environment is an exact copy of the working one (Python 3.10.12, the lock file,
    CUDA 12.8 torch), and moving to a newer Python is a separate, deliberate step.
  status: decided
  built: yes
  dates: [2026-10-04, 2026-10-06]
  source: the one-MUD plan
  from: []
  section: plan.md#architecture
- id: ARCH-2
  text: >-
    CPU and LLM jobs and the one-layer preview run as background jobs in separate worker
    processes, one lane per kind, each lane one job at a time; jobs are tracked as files in the
    lake, can be cancelled, and outlive a backend restart. Workers pin their maths libraries to one
    thread, so results repeat exactly. GPU jobs run on a lane inside the backend (DATA-8).
  status: decided
  built: yes
  dates: [2026-10-08, 2026-10-09, 2026-10-11]
  source: the slice 1 plan; the slice 1c plan (the preview lane, kept by L16.5)
  from: []
  section: plan.md#jobs
- id: ARCH-3
  text: >-
    A lens lives in the lake beside its capture, as derived data, with immutable versions; saving a
    version copies its records and its atlas entries into data/lenses/ in the repo. Legacy schemas
    stay readable through the same endpoints.
  status: decided
  built: yes
  dates: [2026-10-08]
  source: the slice 1 plan
  from: []
  section: plan.md#lenses
- id: ARCH-4
  text: >-
    One command interface: POST /api/commands (show a view, build a lens) and a server-sent event
    stream to every open app (show, job and lens events); the MUD sends the same to one player's
    app as app_command; every command is logged.
  status: decided
  built: yes
  dates: [2026-10-08]
  source: the slice 1 plan
  from: []
  section: plan.md#commands
- id: ARCH-5
  text: >-
    The app's view state lives in the address (URL), so a deep link, a command, a figure's recipe
    and a screenshot name the same view.
  status: decided
  built: yes
  dates: [2026-10-08]
  source: the slice 1 plan
  from: []
  section: plan.md#the-app-today
- id: ARCH-6
  text: >-
    LLM analysts run as `claude -p` with a JSON schema, no tools, no project instructions and no
    saved session, from an empty folder, with an allowlisted environment and no API key; evidence
    packets are hashed and stored, and a number checker re-computes every cited number.
  status: decided
  built: yes
  dates: [2026-10-08]
  source: the slice 1 plan
  from: []
  section: plan.md#llm-analysts
- id: ARCH-7
  text: >-
    The MUD is Evennia 6 in Docker, with areas: Winter Survival's behaviour only in its own rooms,
    plain Evennia elsewhere, a prompt after every command, scenarios loaded fresh through a control
    channel (load, end, status) that the agent can't type into, and the scenario library mounted
    read-only from the repo.
  status: decided
  built: yes
  dates: [2026-10-06]
  source: the one-MUD plan
  from: []
  section: plan.md#the-mud
- id: ARCH-8
  text: >-
    Continuous integration on GitHub for each area: the backend (compile, ruff, mypy strict, tests
    on a CPU-only install), the app (lint, type check, unit tests, build) and the MUD (its gates and
    test tiers), with one pre-commit hook that runs each area's checks.
  status: decided
  built: yes
  dates: [2026-10-06, 2026-10-08]
  source: >-
    Andrew's Phase 3 rulings (the backend's first checks; ruff and mypy blocking); the one-MUD
    plan's Phases 4 and 6 (the MUD's CI, one pre-commit hook, strict mypy); the slice 1 plan (the
    app's unit tests)
  from: []
  section: plan.md#testing
- id: ARCH-9
  text: >-
    The two documents are markdown in the repo plus the requirements list, built into two private
    web pages by one script (docs/pages/build.py): an index rail, requirement chips, question cards,
    a box to write in under every section saved to the page's private store, and the collected
    writing; the design page keeps its address and its answers.
  status: proposed
  built: partly
  dates: [2026-10-11]
  source: Claude
  from: []
  section: plan.md#documents
- id: ARCH-10
  text: >-
    The new app is built inside today's frontend as new pages, one per room, beside today's views
    until they are removed; the chart code (Sankey options, expert order, colour maths, lit paths, the
    3-D layout, exports) moves over with its unit tests; styles come from design tokens (CSS
    variables), one accent set per room.
  status: proposed
  built: no
  dates: [2026-10-11]
  source: Claude
  from: []
  section: plan.md#the-new-app

  built: yes
  dates: [2026-10-06]
  source: message
  from: []
  section: plan.md#how-we-work
- id: WAY-2
  text: >-
    Source code changes only when Andrew has said that code may change for the task (code-change
    mode); auto mode alone doesn't grant it. Sentence sets, research notes, scratchpads and memory
    are exempt.
  status: decided
  built: yes
  dates: [standing]
  source: CLAUDE.md

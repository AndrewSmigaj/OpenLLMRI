# ---- GOAL: what OpenLLMRI is for, who uses it, its pieces ----
- id: GOAL-1
  text: >-
    Build an evidence-based paradigm of how gpt-oss-20b understands the world and makes decisions
    from that understanding: which internal representations exist; where they form (which layers,
    which tokens); how each layer transforms them; how tokens move through them, across layers and
    over time; how experts route them, through pipelines and hubs; and how they lead to behaviour,
    including the points where reasoning fails, such as the context shift the paper studied.
  status: decided
  built: partly
  dates: [2026-10-04, 2026-10-06, 2026-10-07]
  source: message
  from: [155]
  section: design.md#purpose
- id: GOAL-2
  text: >-
    The AI scientists work toward the paradigm with lenses on sentence sets and scenarios,
    scaffolding experiments, steering from outside and inside the model, and ablation. How a
    scaffold changes the way trajectories form (for example, suppressing a writing style) is
    evidence about how the model works.
  status: decided
  built: partly
  dates: [2026-10-04, 2026-10-07]
  source: message
  from: [155]
  section: design.md#purpose
- id: GOAL-3
  text: >-
    The paradigm makes it possible to monitor agents visually: which understandings are active as
    they reason and act. This also helps in building effective scaffolds.
  status: decided
  built: no

# ---- PRIN: principles ----
- id: PRIN-1
  text: >-
    Visual knowledge discovery first: every analysis has a view.
  status: decided
  built: partly
  dates: [2026-10-06]
  source: message
  from: [215]
  section: design.md#principles
- id: PRIN-2
  text: >-
    Two instruments, each measuring something different. UMAP lenses measure conceptual
    membership: fitted per layer, because the directions that separate concepts change with depth;
    what counts is which node a state falls in, never the UMAP axes; two designed axes can give four
    nodes, showing how the two are used together; a trajectory is a path through each layer's
    nodes. Mass-mean lenses measure position on one designed contrast, where distance along the
    axis means something.
  status: decided
  built: yes
  dates: [2026-10-06]
  source: message
  from: [216]
  section: design.md#principles
- id: PRIN-3
  text: >-
    Distances in full raw space are affected by noise, so the instruments read concept membership
    and contrast positions instead.
  status: decided
  built: yes
  dates: [2026-10-07]
  source: message
  from: [226]
  section: design.md#principles
- id: PRIN-4
  text: >-
    Evidence over habit: choices between the instruments are made by comparison, not by the
    common habit of moving to raw space because UMAP distorts distances.
  status: decided

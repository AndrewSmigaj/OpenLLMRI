# OpenLLMRI's requirements: every decision, idea, view, proposal and open question, numbered by
# area (DESIGN.md L26.2, 2026-10-11). Both documents are written from this list and cite its ids:
# docs/design/design.md (design and requirements) and docs/architecture/plan.md (plan and
# architecture). Decisions are paraphrased: Andrew's own words never appear in the repo.
#
# Fields:
#   id       AREA-n. Ids are never reused; a replaced requirement stays, with status retired.
#   text     the requirement, paraphrased.
#   status   decided | idea (Andrew suggested it, not yet decided) | view (his opinion, as
#            context) | proposed (Claude's, waiting for his yes) | open (an experiment or a
#            question settles it) | built (it exists; no separate decision is recorded) |
#            retired (replaced; see replaced_by)
#   built    yes | partly | no. Left out for views.
#   dates    when it was decided, suggested or proposed.
#   source   what settled it: a question in the design's form (L16.4), his message that day
#            (message), the section-by-section review of DESIGN.md (design review), the time
#            design (time design) or its review (time review), a plan he approved (the slice 1b
#            plan), Claude's final read (Part M), or Claude's proposal (Claude). "In DESIGN.md's
#            appendix" means DESIGN.md recorded the decision only in its appendix of decisions.
#   from     the lines of docs/DESIGN.md, at the commit named in `snapshot`, that carry the
#            passage's mark. `docs/pages/check.py` shows every marked line mapped to an id. Empty
#            when the passage carries no mark: a decision recorded only in the appendix, a working
#            rule from Claude's notes, or a plan's detail.
#   section  where the passage is designed: design.md#<anchor> or plan.md#<anchor>.
#   replaced_by  for a retired requirement.

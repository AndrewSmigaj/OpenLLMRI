- id: LENS-47
  text: >-
    How the node card reads who wrote a split (Claude's proposal, for Andrew's answer: L33): the
    shares are measured along the line between the two groups' mean states (the axis a mass-mean
    lens uses), each beside the same share for random splits of the same items, and a share is
    marked only where a second direction, the shrinkage discriminant, also puts it outside its
    random range, on the same side.
  status: retired
  built: no
  dates: [2026-10-16]
  source: Claude
  from: []
  section: design.md#retired
  replaced_by: [LENS-48]
- id: LENS-48
  text: >-
    Who writes each split stays off the node card for now (Claude's revised proposal, 2026-10-18,
    for Andrew's answer: L33): the attention-and-experts study and its findings stand; the
    node-card code built for it goes to a branch rather than into main; the question returns with
    the extra token positions of slice 2 and with the interventions of slice 8. Reasons: most
    node-split readings change with the direction measured along; along the second direction they
    are flagged no more often than chance; and random splits are not a like-for-like comparison for
    splits the clustering picks.
  status: proposed
  built: no
  dates: [2026-10-18]
  source: Claude
  from: []
  section: design.md#lenses
- id: LENS-49
  text: >-
    Attention joins the analysis as more information. At each layer the router's top four experts
    work together to set the token's place in the residual stream, adding their outputs to it.
  status: decided
  built: no
  dates: [2026-10-19]
  source: message
  from: []
  section: design.md#attention
- id: LENS-50
  text: >-
    Can attention be analysed for each expert node and each latent node? In a UMAP lens, tokens
    part ways at a node and go on to different nodes in later layers, so what attention does could
    be followed along those nodes and edges.
  status: idea
  built: no
  dates: [2026-10-19]
  source: message
  from: []
  section: design.md#attention
- id: LENS-51
  text: >-
    How attention is measured (Claude's proposal, for Andrew's answer: L35.1): at each layer,
    attention's output at the read token is split exactly into one part per earlier position (each
    head's weight on the position times the position's value, through the output projection; each
    head's learned sink takes its share first, and the projection's bias stays apart). A word's
    amount is the length of its parts, its pieces summed, as a share of all the parts at that
    layer, over the 64 heads together. Never the weights alone; later layers are read as
    positions, which have taken in other words, rather than as words; the 128-token window of
    every second layer is shown.
  status: proposed
  built: no
  dates: [2026-10-19]
  source: Claude
  from: []
  section: design.md#attention
- id: LENS-52
  text: >-
    Attention for latent nodes and edges (Claude's proposal, L35.2): at each split point, each
    branch against the node's other items, at each layer up to the branch's own: where attention
    draws from (the read word itself, the token before it, the first token, the other words),
    against the branch shuffled within the node 1,000 times; the three words each item drew on
    most, listed for the split point's analyst to describe what they share; and words that recur,
    tested the same way, beside how much commoner each is in the branch's texts. Past the split, a
    route through several later nodes gets the same readings at each layer along it, its tokens
    against the other tokens of the node they are in. Read as what the tokens took in, not as what
    made the split.
  status: proposed
  built: no
  dates: [2026-10-19]
  source: Claude
  from: []
  section: design.md#attention
- id: LENS-53
  text: >-
    Attention for expert nodes and edges (Claude's proposal, L35.3): the share of a node's items
    whose expert at that rank would be another if the item's own attention at that layer were
    replaced by the lens's average (brought by attention), beside the layer's share, worked out on
    the CPU from what captures store; the words that pushed the items toward the expert (each
    word's part of the expert's router score, less its mean part over the 32 experts), the node's
    items against the layer's others, tested by shuffles. An expert edge gets the same readings for
    its tokens, against the other tokens leaving its first expert. The readings follow the rank the
    expert Sankey shows (the first by default), and the row also gives how many of each token's
    four experts its own attention changed. A computation on the router alone, not an ablation.
  status: proposed
  built: no
  dates: [2026-10-19]
  source: Claude
  from: []
  section: design.md#attention
- id: LENS-54
  text: >-
    Not done with attention (Claude's proposal, L35.6): maps of raw weights as the main view;
    single heads; attention's share of a split as a headline; attention rolled out or traced back
    across layers; claims about causes from these readings (they need ablation, slice 8); words for
    single-word sets beyond the prompt's template and the word's own earlier pieces.
  status: proposed
  built: no
  dates: [2026-10-19]
  source: Claude
  from: []
  section: design.md#attention
# ---- TIME: reading over time ----
- id: TIME-1
  text: >-
    Three orderings are time: context steps (a sentence sequence grows), ticks (the agent's turns)
    and reasoning steps (the reasoning stream grows inside one tick). Readings are compared within
    one ordering, never from one tick's reasoning to the next tick's, and depth (the layer) is not
    time.
  status: decided
  built: no
  dates: [2026-10-07]
  source: L4
  from: [540]
  section: design.md#time
- id: TIME-2
  text: >-
    The next tick's input excludes earlier reasoning streams: the runner hands back only the action
    as the model's turn, as gpt-oss's chat format does.
  status: built
  built: yes
  dates: []
  source: ""
  from: [546]
  section: design.md#time
- id: TIME-3
  text: >-
    The project's own rules for reading over time, each kept because it earns its place: the same
    kind of site read the same way every time; validation on held-out scene families; the lens
    checked in the context it reads; statistics at the scene-family level; one fixed, saved lens
    reads every point; dynamics computed within one ordering. References are a tool for studies,
    not a rule for every reading.
  status: decided
  built: partly
  dates: [2026-10-07]
  source: L4
  from: [550]
  section: design.md#time
- id: TIME-4
  text: >-
    For an agent run, the main reading is at the output: each lens is read at its keywords in the
    agent's action (the scenario's MUD commands), the same kind of site every tick, where the
    decision is written.
  status: decided
  built: no
  dates: [2026-10-07]
  source: L2
  from: [565]
  section: design.md#time
- id: TIME-5
  text: >-

# Who writes each split, attention or the experts (LENS-30's first part): a study on stored captures,
# moved ahead in the order of work while the machine is shared (ORDER-20). It needs no model: every
# capture stores each layer's output and the experts' output at the read token. Its findings note is
# the record of the runs; each ledger line stays proposed until it is reviewed (DESIGN.md H). Which
# direction the node card measures along waits for Andrew (L33).
id: attention_experts
title: Who writes each split, attention or the experts
question: >
  When a lens's classes or nodes part, which part of the model writes the difference into the read
  token's state: attention, which brings in the other tokens, or the experts, which transform the
  token itself, and at which layers? Each layer adds both, unscaled, so the difference between two
  groups' mean states divides exactly into the embedding's, attention's and the experts' parts,
  layer by layer. The experts write the larger updates everywhere, so every share is read against
  the same share for random splits of the same items.
status: active
started: 2026-10-16
sets:
  - tank_polysemy_v3
  - tank_q1_calibration_v1
  - threatened_framing_v1_carrier
  - bus_stop_friend_foe_v2
  - nouns_meaning_feeling_v1
  - animals_ontology_v1
  - objects_harm_v1

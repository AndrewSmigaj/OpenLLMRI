id: umap_vs_raw
title: Does the UMAP lens beat raw space?
question: >
  UMAP is preferred once it holds up as a classifier against raw-space groupings. Validation has
  compared them on the label alone, where the UMAP lens hasn't won. Held out on the same folds and
  at the same number of groups, does the UMAP lens recover the other designed attributes, and pairs
  of attributes that cross, better than raw Ward and raw spectral groupings?

# Winter Survival MUD — local dev stack.
#
#   docker compose build        # build the evennia image (psycopg2 + pytest)
#   make init                   # one-time: scaffold the Evennia game dir
#   make migrate                # create schema in Postgres
#   make accounts               # create admin + bot accounts (idempotent)
#   make load-scenario          # load the smoketest world
#   docker compose up           # run the server (telnet, web and websocket on the host ports below)
#
# Everything the MUD needs runs here. The torch bot-agent runs on the host.
#
# Host ports come from the repo root's .env (MUD_TELNET_PORT, MUD_WEB_PORT, MUD_WS_PORT; the
# Makefile passes it to compose), defaulting to Evennia's 4000-4002. Inside the container Evennia
# always listens on 4000-4002.

name: llmri-mud

services:
  postgres:
    image: postgres:16
    container_name: llmri-mud-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    expose:
      - "5432"

  evennia:
    build: ./docker/evennia
    image: llmri-mud-evennia:latest
    container_name: llmri-mud-evennia
    env_file: .env
    environment:
      # The web client connects to the websocket's HOST port, not the container's.
      WEBSOCKET_CLIENT_PROXY_PORT: ${MUD_WS_PORT:-4002}
      # The scenario library and the lab presets: one copy each in the repo, mounted read-only below.
      SCENARIO_LIBRARY: /usr/src/scenarios
      LAB_PRESETS: /usr/src/labs
      # The account the backend's agent runner logs in with (the repo root's .env); `make accounts`
      # creates it. Empty when there is no root .env (CI).
      EVENNIA_AGENT_USER: ${EVENNIA_AGENT_USER:-}
      EVENNIA_AGENT_PASS: ${EVENNIA_AGENT_PASS:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./game:/usr/src/game
      - ../data/scenarios:/usr/src/scenarios:ro
      - ../data/labs:/usr/src/labs:ro
    working_dir: /usr/src/game
    stdin_open: true
    tty: true
    ports:
      - "${MUD_TELNET_PORT:-4000}:4000"   # telnet (game)
      - "${MUD_WEB_PORT:-4001}:4001"   # webserver / website
      - "${MUD_WS_PORT:-4002}:4002"   # websocket client
    # Start in the foreground so the container stays alive and logs to stdout.
    # The image's entrypoint word-splits its arguments, so we hand it a single
    # script path rather than a quoted `bash -c "... && ..."` (which would break).
    # server/docker_start.sh is created during `make init` (see scripts/).
    command: sh server/docker_start.sh

volumes:
  pgdata:

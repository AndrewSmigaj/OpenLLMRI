[project]
name = "concept-mri"
version = "0.1.0"
description = "Concept MRI - MoE model analysis using Concept Trajectory Analysis"
authors = [{name = "OpenAI Hackathon Team"}]
readme = "README.md"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["backend.src"]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
# The backend's own packages (api, services, adapters, …) sort as first-party imports.
src = ["backend/src"]
select = ["E", "F", "I", "N", "W"]
# N806/N812: maths and ML convention (X for a data matrix, F for torch.nn.functional).
ignore = ["E501", "N806", "N812"]

target-version = "py310"

[tool.ruff.per-file-ignores]
# The .env loads, and backend/src joins sys.path, before the imports that need them.
"backend/src/api/main.py" = ["E402"]
"backend/src/api/dependencies.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
# Run from the repo root: the backend's packages live in backend/src.
files = ["backend/src"]
mypy_path = "backend/src"
explicit_package_bases = true
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/src"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"